[package]
name = "obsidia-app"
version = "0.1.0"
description = "Obsidia: launcher de Minecraft Java"
authors = ["Lautaro Lopez"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "obsidia_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "gzip", "brotli", "stream"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
keyring = "3"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
httpmock = "0.9"
