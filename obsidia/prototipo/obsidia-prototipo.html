function rpAct(n){S.dc=null;const v=S.mods[n]||0;if(v==='w')return;if(v===1){S.ra[n]=!S.ra[n]}else{S.mods[n]='w';setTimeout(()=>{S.mods[n]=1;S.ro.unshift(n);if($('#grid'))$('#grid').innerHTML=grid()},1100)}$('#grid').innerHTML=grid()}
S.sv=[{n:'SMP de amigos',a:'smp.amigos.example',v:'1.21.4',on:true,pl:'8/20',pg:34},{n:'Creativo',a:'creativo.example.net',v:'1.20.1',on:true,pl:'3/40',pg:72},{n:'Servidor local',a:'localhost',v:'1.21',on:false,pl:'0/10',pg:0}];S.af=false;S.rf=false;
function servers(){const pv=(P[S.p].s.match(/\d+\.\d+(\.\d+)?/)||[])[0],pc=x=>x<60?'#34D399':x<120?'#FBBF24':'#F87171';return `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><h1>Servidores</h1><div style="display:flex;gap:10px"><button class="sec" style="height:44px" data-act="sref">${S.rf?'Actualizando…':'Actualizar'}</button><button class="ib" style="margin:0;padding:0 22px;height:44px" data-act="sadd">+ Añadir servidor</button></div></div>${S.af?`<div class="gl" style="padding:18px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><input id="sn" class="srch" style="flex:1;min-width:180px" aria-label="Nombre del servidor" placeholder="Nombre del servidor"><input id="sa" class="srch" style="flex:1;min-width:220px" aria-label="Dirección del servidor" placeholder="Dirección (ej. mi.servidor.net)"><button class="ib" style="margin:0;padding:0 24px;height:48px" data-act="ssave">Guardar</button></div>`:''}<div class="mu">Se comparan con la versión de tu perfil activo: ${P[S.p].n}${pv?' ('+pv+')':''}. Datos de ejemplo.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px">${S.sv.map((s,i)=>{const diff=pv&&s.v!==pv;return `<div class="gl" style="padding:18px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:14px"><div class="th" style="width:52px;height:52px;background:${G[i%4]}"></div><div style="flex:1;min-width:0"><b>${s.n}</b><div class="mu">${s.a}</div></div><span class="pf" style="color:${s.on?'#34D399':'#F87171'}">${s.on?'En línea':'Sin conexión'}</span></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pf" style="color:#C9C7DD">${s.v}</span>${s.on?`<span class="pf" style="color:#C9C7DD">${s.pl} jugadores</span><span class="pf" style="color:${pc(s.pg)}">${s.pg} ms</span>`:''}${diff?'<span class="pf" style="color:#FCD34D">Versión distinta a tu perfil</span>':''}</div><div style="display:flex;gap:10px"><button class="ib" style="flex:1;margin:0;${s.on?'':'opacity:.5;cursor:default'}" ${s.on?'':'disabled'} data-act="join" data-n="${s.n}">Unirse</button><button class="mb" style="width:auto;height:38px;padding:0 14px;font-size:14px" aria-label="Quitar ${s.n}" data-act="sdel" data-i="${i}">Quitar</button></div></div>`}).join('')}</div>`}
S.nick='Jugador';S.ms=false;S.ml=false;S.sk=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKN=[['#3B2A1E','#E0A97B','#3B5BDB','#B5835A','Clásica'],['#1E1B4B','#F1C9A5','#8B5CF6','#C98F6B','Noche'],['#C026D3','#F5D0B5','#22D3EE','#D4A07A','Neón'],['#111827','#8D5A3B','#34D399','#6B3F28','Bosque']];
const head=(i,s)=>{const k=SKN[i];return `<svg width="${s}" height="${s}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" style="border-radius:8px;flex:none"><rect width="8" height="8" fill="${k[1]}"/><rect width="8" height="3" fill="${k[0]}"/><rect y="3" width="1" height="2" fill="${k[0]}"/><rect x="7" y="3" width="1" height="2" fill="${k[0]}"/><rect x="1" y="4" width="2" height="1" fill="#fff"/><rect x="5" y="4" width="2" height="1" fill="#fff"/><rect x="2" y="4" width="1" height="1" fill="${k[2]}"/><rect x="5" y="4" width="1" height="1" fill="${k[2]}"/><rect x="3" y="6" width="2" height="1" fill="${k[3]}"/></svg>`};
const accCard=()=>`${head(S.sk,40)}<div><div style="font-weight:600">${esc(S.nick)||'Jugador'}</div><div class="mu">${S.ms?'Cuenta Microsoft':'Cuenta offline'}</div></div>`;
function account(){const ok=/^\w{3,16}$/.test(S.nick);return `<h1>Mi cuenta</h1><div style="display:grid;grid-template-columns:1fr 1.3fr;gap:16px;align-items:start"><div class="gl" style="padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px">${head(S.sk,132)}<div style="width:100%"><label class="mu" for="nick">Nombre de jugador</label><input id="nick" class="srch" style="width:100%;margin-top:6px" maxlength="16" autocomplete="off" value="${esc(S.nick)}"><div id="nm" style="margin-top:8px;font-size:13px;color:${ok?'#6EE7B7':'#FCD34D'}">${ok?'Nombre válido ✓':'Usá de 3 a 16 letras, números o guion bajo.'}</div></div></div><div style="display:flex;flex-direction:column;gap:16px"><div class="gl" style="padding:20px 22px;display:flex;flex-direction:column;gap:10px"><b>Tipo de cuenta</b><div style="color:${S.ms?'#6EE7B7':'#C9C7DD'}">${S.ms?'Cuenta Microsoft vinculada (simulado)':'Estás jugando en modo offline'}</div><div class="mu">${S.ms?'Podés entrar a servidores premium y usar tu skin oficial.':'En modo offline no podés entrar a servidores que verifican la cuenta.'}</div>${S.ms?'<button class="sec" style="height:44px" data-act="mso">Cerrar sesión</button>':`<button class="ib" style="margin:0;height:44px" data-act="ms">${S.ml?'Conectando…':'Iniciar sesión con Microsoft'}</button>`}</div><div class="gl" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px"><b>Skin</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${SKN.map((k,i)=>`<button class="pc gl ${i==S.sk?'on':''}" style="flex-direction:column;padding:12px" data-act="skin" data-i="${i}">${head(i,56)}<span class="mu">${k[4]}</span></button>`).join('')}</div><button class="sec" style="height:44px;opacity:.6;cursor:default" disabled>Subir skin (pronto)</button></div></div></div>`}
const TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
const trb=(n,h)=>`<button class="mb" style="width:${S.dc==n?'auto':h+'px'};height:${h}px;padding:0 ${S.dc==n?'14px':'0'};font-size:13px;font-weight:600;color:${S.dc==n?'#fff':'#F87171'};background:${S.dc==n?'#DC2626':'rgba(255,255,255,.06)'}" aria-label="Eliminar ${n}" data-act="rpdel" data-n="${n}">${S.dc==n?'¿Eliminar?':TRASH}</button>`;
function home(){const p=P[S.p],n=M.filter(m=>S.mods[m[0]]===1).length,g=S.pg,st=g===null?'':g<30?'Verificando archivos…':g<80?'Descargando recursos del juego…':g<100?'Iniciando Java…':S.jt?'Conectando a '+S.jt+' (simulado)':'Minecraft iniciado (simulado)';
return `<section class="hero"><div class="shard" aria-hidden="true"></div><div class="mu" style="color:#C4B5FD;font-weight:600;letter-spacing:2px;font-size:12px">PERFIL ACTIVO</div><h1 style="font-size:42px;line-height:1.1">${p.n}</h1><div style="color:#C9C7DD">${p.s} · ${S.java} · ${S.ram} GB de RAM${S.sa?' · Shader: '+S.sa:''}</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px"><button class="play" data-act="play" ${g!==null?'disabled':''}>${g===null?'JUGAR':g<100?'Preparando… '+g+' %':'EN JUEGO'}</button><button class="sec" data-act="go" data-t="settings">Configurar</button></div></section>
${g!==null?`<div class="gl" style="padding:14px 18px"><div style="display:flex;justify-content:space-between;font-size:13px;color:#C9C7DD"><span>${st}</span><span>${g} %</span></div><div class="bar" style="margin-top:10px"><i style="width:${g}%"></i></div></div>`:''}
<div class="g3"><div class="st gl"><span class="mu">Tiempo jugado</span><b>128 h</b></div><div class="st gl"><span class="mu">Mods instalados</span><b>${n}</b></div><div class="st gl"><span class="mu">Último inicio</span><b>Ayer</b></div></div>
<h2>Tus perfiles</h2><div class="g3">${cards()}</div>`}
function cards(){return P.map((p,i)=>`<button class="pc gl ${i==S.p?'on':''}" data-act="sel" data-i="${i}"><div class="th" style="background:${G[i%4]}"></div><div><div style="font-weight:600">${p.n}</div><div class="mu">${i==S.p?'Activo · ':''}${p.s}</div></div></button>`).join('')}
function profiles(){return `<h1>Perfiles</h1><div class="mu">Elegí con cuál jugar o creá uno nuevo.</div><div class="g3">${cards()}<button class="pc gl" style="border-style:dashed;justify-content:center;min-height:92px;color:var(--mu)" data-act="new">+ Nuevo perfil</button></div>`}
function grid(){if(S.sec=='shaders')return sgrid();if(S.sec=='packs')return rgrid();const q=S.q.toLowerCase();return M.filter(m=>(S.f=='Todos'||m[2]==S.f)&&m[0].toLowerCase().includes(q)).map(m=>{const v=S.mods[m[0]]||0;return `<div class="mc gl"><div style="display:flex;align-items:center;gap:12px"><div class="mi" style="background:${m[3]}"></div><b>${m[0]}</b></div><div class="mu" style="line-height:1.5">${m[1]}</div><div style="display:flex;gap:10px;margin-top:auto"><button class="ib ${v===1?'in':''}" style="flex:1;margin:0" data-act="mod" data-n="${m[0]}">${v==='w'?'Instalando…':v===1?'Instalado ✓':'Instalar'}</button>${v===1?trb(m[0],38):''}</div></div>`}).join('')||'<div class="mu">No hay resultados.</div>'}
function mods(){return S.sec=='shaders'?shaders():S.sec=='packs'?packs():mv()}
function mv(){return `<div style="display:flex;justify-content:space-between;align-items:center"><h1>Mods</h1><div class="gl" style="padding:9px 16px;color:#C9C7DD;font-size:14px">Perfil: ${P[S.p].n}</div></div>${seg()}<input id="q" class="srch" aria-label="Buscar mods" placeholder="Buscar en Modrinth…" value="${S.q}"><div class="chips">${['Todos','Optimización','Gráficos','Utilidades'].map(c=>`<button class="chip ${c==S.f?'on':''}" data-act="f" data-c="${c}">${c}</button>`).join('')}</div><div class="g3" id="grid">${grid()}</div>`}
function settings(){return `<h1>Ajustes</h1><div class="row gl"><div><div style="font-weight:600">Memoria RAM</div><div class="mu">Cuánta memoria usa Minecraft</div></div><div style="display:flex;align-items:center;gap:14px"><input type="range" id="ram" min="2" max="16" value="${S.ram}" aria-label="Memoria RAM"><b id="ramv" style="width:60px">${S.ram} GB</b></div></div><div class="row gl"><div><div style="font-weight:600">Versión de Java</div><div class="mu">Obsidia la descarga sola si falta</div></div><select id="java" aria-label="Versión de Java">${['Java 8','Java 17','Java 21'].map(j=>`<option ${j==S.java?'selected':''}>${j}</option>`).join('')}</select></div>${sw('close','Cerrar el launcher al jugar','Libera memoria mientras jugás')}${sw('lite','Modo ligero','Sin animaciones, ideal para PCs modestas')}${sw('cons','Mostrar consola','Ver los logs del juego en vivo')}`}
function render(){document.body.classList.toggle('lite',S.t.lite);$('#acc').innerHTML=accCard();$('#acc').classList.toggle('on',S.tab=='account');$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==S.tab?'on':''}" data-act="go" data-t="${t[0]}">${ic(t[0])}${t[1]}</button>`).join('');$('#view').innerHTML={home,profiles,mods,servers,settings,account}[S.tab]()}
function play(){if(S.pg!==null)return;S.pg=0;const id=setInterval(()=>{S.pg+=4;if(S.pg>=100){S.pg=100;clearInterval(id);setTimeout(()=>{S.pg=null;render()},2500)}render()},120)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
if(a=='go'){S.tab=d.t;render()}else if(a=='sel'){S.p=+d.i;render()}else if(a=='play'){S.jt=null;play()}
else if(a=='new'){P.push({n:'Perfil nuevo '+(P.length-3),s:'Vanilla · 1.21.4'});render()}
else if(a=='f'){S.f=d.c;render()}else if(a=='tg'){S.t[d.k]=!S.t[d.k];render()}
else if(a=='seg'){S.sec=d.s;S.q='';render()}else if(a=='sh'){shAct(d.n)}else if(a=='join'){if(S.pg===null){S.jt=d.n;play()}S.tab='home';render()}else if(a=='sadd'){S.af=!S.af;render()}else if(a=='ssave'){const nm=$('#sn').value.trim(),ad=$('#sa').value.trim();if(nm&&ad){S.sv.push({n:nm,a:ad,v:(P[S.p].s.match(/\d+\.\d+(\.\d+)?/)||['1.21.4'])[0],on:true,pl:'0/20',pg:50});S.af=false}render()}else if(a=='sdel'){S.sv.splice(+d.i,1);render()}else if(a=='sref'){S.rf=true;render();setTimeout(()=>{S.sv.forEach(s=>{if(s.on)s.pg=Math.max(15,s.pg+Math.round((Math.random()-.5)*30))});S.rf=false;render()},800)}else if(a=='skin'){S.sk=+d.i;render()}else if(a=='ms'){S.ml=true;render();setTimeout(()=>{S.ms=true;S.ml=false;render()},1200)}else if(a=='mso'){S.ms=false;render()}else if(a=='ract'){S.ra[d.n]=!S.ra[d.n];$('#grid').innerHTML=grid()}else if(a=='rpdel'){const n=d.n;if(S.dc==n){S.mods[n]=0;S.ro=S.ro.filter(x=>x!=n);delete S.ra[n];if(S.sa==n||n=='Iris Shaders')S.sa=null;S.dc=null}else{S.dc=n;setTimeout(()=>{if(S.dc==n){S.dc=null;if($('#grid'))$('#grid').innerHTML=grid()}},3000)}$('#grid').innerHTML=grid()}else if(a=='rp'){rpAct(d.n)}else if(a=='mv'){const i=S.ro.indexOf(d.n),j=i+ +d.d;if(j>=0&&j<S.ro.length){[S.ro[i],S.ro[j]]=[S.ro[j],S.ro[i]]}$('#grid').innerHTML=grid()}else if(a=='auto'){S.ro=[...S.ro.filter(n=>TY[n]=='retoque'),...S.ro.filter(n=>TY[n]=='base')];$('#grid').innerHTML=grid()}else if(a=='mod'){const v=S.mods[d.n]||0;if(v==='w')return;if(v===1){return}else{S.mods[d.n]='w';setTimeout(()=>{S.mods[d.n]=1;if($('#grid'))$('#grid').innerHTML=grid()},1100)}$('#grid').innerHTML=grid()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#grid').innerHTML=grid()}else if(e.target.id=='ram'){S.ram=+e.target.value;$('#ramv').textContent=S.ram+' GB'}else if(e.target.id=='java'){S.java=e.target.value}else if(e.target.id=='nick'){S.nick=e.target.value;$('#acc').innerHTML=accCard();const ok=/^\w{3,16}$/.test(S.nick);$('#nm').textContent=ok?'Nombre válido ✓':'Usá de 3 a 16 letras, números o guion bajo.';$('#nm').style.color=ok?'#6EE7B7':'#FCD34D'}});
render();
</script>
</body>
</html>
